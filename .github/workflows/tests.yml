name: Inference API tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0 fastapi==0.143.0 httpx==0.28.1 python-multipart==0.0.32
      - run: python -B -m unittest discover -s tests -v
